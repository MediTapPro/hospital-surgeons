name: Process Expired Subscriptions

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  process:
    runs-on: ubuntu-latest
    steps:
      - name: Call API
        env:
          CRON_SECRET: ${{ github.ref_name == 'master' && secrets.PROD_CRON_SECRET || secrets.DEV_CRON_SECRET }}
          APP_URL: ${{ github.ref_name == 'master' && secrets.PROD_APP_URL || secrets.DEV_APP_URL }}
        run: |
          response=$(curl -sL -w "\n%{http_code}" -X GET \
            -H "x-cron-secret: $CRON_SECRET" \
            "$APP_URL/api/cron/process-expired-subscriptions")
          http_code=$(echo "$response" | tail -n1)
          body=$(echo "$response" | head -n-1)
          echo "Response: $http_code"
          if [ "$http_code" -lt 200 ] || [ "$http_code" -ge 300 ]; then
            echo "Body: $body"
            exit 1
          fi
