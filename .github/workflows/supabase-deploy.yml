name: Deploy Supabase Migrations

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - 'supabase/migrations/**'

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Set environment
        id: env
        run: |
          if [ "${{ github.ref_name }}" = "master" ]; then
            echo "project_ref=${{ secrets.PROD_PROJECT_REF }}" >> $GITHUB_OUTPUT
            echo "supabase_token=${{ secrets.PROD_SUPABASE_ACCESS_TOKEN }}" >> $GITHUB_OUTPUT
            echo "app_url=${{ secrets.PROD_APP_URL }}" >> $GITHUB_OUTPUT
            echo "cron_secret=${{ secrets.PROD_CRON_SECRET }}" >> $GITHUB_OUTPUT
          else
            echo "project_ref=${{ secrets.DEV_PROJECT_REF }}" >> $GITHUB_OUTPUT
            echo "supabase_token=${{ secrets.DEV_SUPABASE_ACCESS_TOKEN }}" >> $GITHUB_OUTPUT
            echo "app_url=${{ secrets.DEV_APP_URL }}" >> $GITHUB_OUTPUT
            echo "cron_secret=${{ secrets.DEV_CRON_SECRET }}" >> $GITHUB_OUTPUT
          fi

      - name: Install Supabase CLI
        run: npm install -g supabase

      - name: Link Supabase Project
        run: supabase link --project-ref ${{ steps.env.outputs.project_ref }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ steps.env.outputs.supabase_token }}

      - name: Deploy migrations
        run: supabase db push
        env:
          SUPABASE_ACCESS_TOKEN: ${{ steps.env.outputs.supabase_token }}

      - name: Set app_url and cron_secret in cron_config
        run: |
          supabase db query --linked "
            INSERT INTO cron_config (key, value) VALUES ('app_url', '${{ steps.env.outputs.app_url }}') ON CONFLICT (key) DO UPDATE SET value = EXCLUDED.value;
            INSERT INTO cron_config (key, value) VALUES ('cron_secret', '${{ steps.env.outputs.cron_secret }}') ON CONFLICT (key) DO UPDATE SET value = EXCLUDED.value;
          "
        env:
          SUPABASE_ACCESS_TOKEN: ${{ steps.env.outputs.supabase_token }}
